<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map" style="height: 100%"></div>
<script type="module">
  import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.17.0/dist/maplibre-gl.mjs';

  maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

  const map = new maplibregl.Map({
    container: 'map',
    center: [-71.0, 42.25],   // longitute, latitude
    zoom: 9,
    style: {
      url: 'https://demotiles.maplibre.org/globe.json',
      version: 8,
      glyphs: "mapbox://fonts/openmaptiles/{fontstack}/{range}.pbf",
      sources: {
      base: { type: "vector", url: "pmtiles://" + location.origin + "/static/MA.pmtiles"},// Put the downloaded pmtiles file into the static folder
    },
      
      layers: [
        { id: "land", type: "background", paint: { "background-color": "#ABDDA4" } },
        { id: "water", type: "fill", source: "base", "source-layer": "water", paint: { "fill-color": "#006994" } }, 
        { id: "roads", type: "line", source: "base", "source-layer": "roads", paint: { "line-color": "#000", "line-width": 1} },

        // Street names: text follows the line
        {
          id: "road-labels",
          type: "symbol",
          source: "base",
          "source-layer": "roads",
          minzoom: 13,
          layout: {
            "symbol-placement": "line",
            "text-field": ["get", "name"],
            "text-font": ["Noto Sans Regular"],
            "text-size": 11
          },
          paint: { "text-color": "#222", "text-halo-color": "#fff", "text-halo-width": 1.5 }
        },

        // Towns
        {
          id: "town-labels",
          type: "symbol",
          source: "base",
          "source-layer": "places",
          filter: ["in", ["get", "kind"], ["literal", ["locality", "neighbourhood"]]],
          layout: {
            "text-field": ["get", "name"],
            "text-font": ["Noto Sans Regular"],
            "text-size": ["interpolate", ["linear"], ["zoom"], 8, 11, 12, 16]
          },
          paint: { "text-color": "#000", "text-halo-color": "#fff", "text-halo-width": 2 }
        }
        
      ]
    }
  });
</script>
</body>
</html>
